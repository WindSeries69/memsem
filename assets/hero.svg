<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240" role="img" aria-label="memsem — semantic memory for AI agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#79c0ff"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="900" height="240" fill="url(#bg)"/>
  <rect x="0" y="236" width="900" height="4" fill="url(#accent)"/>

  <!-- neural motif -->
  <g stroke="#58a6ff" stroke-opacity="0.35" stroke-width="1.2">
    <line x1="640" y1="40" x2="690" y2="90"/><line x1="640" y1="40" x2="750" y2="55"/>
    <line x1="640" y1="40" x2="760" y2="120"/><line x1="690" y1="90" x2="750" y2="55"/>
    <line x1="690" y1="90" x2="760" y2="120"/><line x1="750" y1="55" x2="760" y2="120"/>
    <line x1="690" y1="90" x2="830" y2="150"/><line x1="760" y1="120" x2="830" y2="150"/>
    <line x1="750" y1="55" x2="830" y2="150"/><line x1="830" y1="150" x2="860" y2="60"/>
    <line x1="830" y1="150" x2="880" y2="180"/>
  </g>
  <g fill="#58a6ff" fill-opacity="0.9">
    <circle cx="640" cy="40" r="5"/><circle cx="690" cy="90" r="4"/>
    <circle cx="750" cy="55" r="4"/><circle cx="760" cy="120" r="4"/>
    <circle cx="830" cy="150" r="6"/><circle cx="860" cy="60" r="3"/>
    <circle cx="880" cy="180" r="3"/>
  </g>
  <g fill="#a371f7" fill-opacity="0.5">
    <circle cx="700" cy="190" r="3"/><circle cx="610" cy="210" r="2.5"/>
    <circle cx="820" cy="205" r="2.5"/><circle cx="860" cy="120" r="2"/>
  </g>
  <g stroke="#a371f7" stroke-opacity="0.2" stroke-width="1">
    <line x1="700" y1="190" x2="610" y2="210"/><line x1="700" y1="190" x2="820" y2="205"/>
    <line x1="820" y1="205" x2="860" y2="120"/><line x1="700" y1="190" x2="860" y2="120"/>
  </g>

  <!-- core circle -->
  <circle cx="415" cy="120" r="10" fill="url(#core)"/>
  <circle cx="415" cy="120" r="22" fill="none" stroke="#a371f7" stroke-opacity="0.35" stroke-width="1.5"/>

  <text x="60" y="112" font-family="system-ui, -apple-system, sans-serif" font-size="62" font-weight="800" fill="url(#accent)" letter-spacing="-1">memsem</text>
  <text x="60" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="21" fill="#e6edf3" font-weight="600">Semantic memory for AI agents</text>
  <text x="60" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#8b949e">remembers what matters · knows what to forget · one command · 100% local</text>
  <text x="60" y="212" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12.5" fill="#a371f7">npx -y memsem   ·   plugin: ["memsem"]   ·   MCP over stdio</text>
</svg>
